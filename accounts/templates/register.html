{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-lg border-0 p-4 mt-5">

            <div class="text-center mb-4">

                <i class="bi bi-person-plus-fill text-success" style="font-size:70px;"></i>

                <h2 class="mt-3">
                    Create Account
                </h2>

                <p class="text-muted">
                    Register to start tracking your expenses.
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success w-100">
                    Register
                </button>

            </form>

            <hr>

            <p class="text-center">

                Already have an account?

                <a href="/accounts/login/">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
