<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Smart Expense Tracker</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>
        body {

            background: #f4f6f9;

        }


        .navbar {

            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);

        }


        .card {

            border: none;

            border-radius: 18px;

            transition: .3s;

        }


        .card:hover {

            transform: translateY(-5px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);

        }


        .nav-link {

            color: white !important;

            font-weight: 500;

        }


        .nav-link:hover {

            color: #ffc107 !important;

        }
    </style>


</head>



<body>



    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">


        <div class="container">


            <a class="navbar-brand fw-bold" href="/expenses/dashboard/">

                <i class="bi bi-wallet2"></i>

                Smart Expense Tracker

            </a>



            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">


                <span class="navbar-toggler-icon"></span>


            </button>





            <div class="collapse navbar-collapse" id="navbarNav">


                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a class="nav-link" href="/expenses/dashboard/">

                            <i class="bi bi-speedometer2"></i>

                            Dashboard

                        </a>

                    </li>




                    <li class="nav-item">

                        <a class="nav-link" href="/expenses/add/">

                            <i class="bi bi-plus-circle"></i>

                            Add Transaction

                        </a>

                    </li>




                    <li class="nav-item">

                        <a class="nav-link" href="/expenses/list/">

                            <i class="bi bi-list-ul"></i>

                            Transactions

                        </a>

                    </li>




                    <li class="nav-item">

                        <a class="nav-link" href="/insights/">

                            <i class="bi bi-bar-chart-line"></i>

                            Insights

                        </a>

                    </li>




                    <li class="nav-item">

                        <a class="nav-link text-danger" href="/accounts/logout/">

                            <i class="bi bi-box-arrow-right"></i>

                            Logout

                        </a>

                    </li>



                </ul>


            </div>


        </div>


    </nav>





    <div class="container mt-4">



        <!-- Messages -->

        {% if messages %}


        {% for message in messages %}



        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">


            <i class="bi bi-info-circle"></i>

            {{ message }}



            <button type="button" class="btn-close" data-bs-dismiss="alert">

            </button>



        </div>



        {% endfor %}


        {% endif %}





        {% block content %}

        {% endblock %}



    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>


</html>
